appId: org.brokspace.ide
productName: Brokspace IDE
executableName: brokspace-ide
copyright: Copyright © 2026 Brokspace contributors
electronDist: ../../node_modules/electron/dist
electronVersion: 44.9.1
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# node_modules is excluded: electron-builder copies Electron, and the backend is bundled.
files:
  - src-gen
  - lib
  - resources/icons/WindowIcon/512-512.png
  - resources/BrokspaceSplash.svg
  - scripts
  - "!**node_modules/**"
extraResources:
  - from: ../../plugins
    to: app/plugins
  # brok and brok-agent (scripts/fetch-brok.mjs), outside the asar so they can run.
  - from: resources/bin
    to: bin

# Updates come from GitHub Releases (latest*.yml are attached to each release).
publish:
  provider: github
  owner: brokspace
  repo: ide

win:
  icon: resources/icon.ico
  target:
    - nsis
mac:
  icon: resources/icons/icon.png
  category: public.app-category.developer-tools
  protocols:
    - name: brokspace-ide
      schemes:
        - brokspace-ide
  darkModeSupport: true
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/LinuxLauncherIcons
  category: Development
  synopsis: Your workspace, understood
  description: The Brokspace IDE, with local-first search, agents, skills and shards.
  mimeTypes:
    - inode/directory
  vendor: Brokspace
  maintainer: Brokspace contributors <hello@brokspace.org>
  target:
    - deb
    - AppImage
    - tar.gz

nsis:
  menuCategory: false
  oneClick: false
  perMachine: false
  installerHeaderIcon: resources/icon.ico
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  # Puts brok (resources\bin) on the user's PATH; see resources/installer.nsh.
  include: resources/installer.nsh
  artifactName: BrokspaceIDE-${version}-windows-${arch}-setup.${ext}
  license: resources/LICENSE
dmg:
  artifactName: BrokspaceIDE-${version}-macos-${arch}.${ext}
  title: Brokspace IDE
deb:
  artifactName: brokspace-ide_${version}_${arch}.${ext}
  # Links /usr/bin/brok and /usr/bin/brokspace-ide; see resources/deb-*.sh.
  afterInstall: resources/deb-postinst.sh
  afterRemove: resources/deb-postrm.sh
  depends:
    - git
appImage:
  artifactName: BrokspaceIDE-${version}-linux-${arch}.${ext}
zip:
  artifactName: BrokspaceIDE-${version}-macos-${arch}.${ext}
tar:
  artifactName: brokspace-ide-${version}-linux-${arch}.${ext}

afterPack: ./scripts/after-pack.js
