<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            margin: 0;
            background-color: #0B0E12;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Avoids a flicker before Theia's own CSS loads. */
            background-image: none;
        }

        .theia-preload::after {
            content: none;
        }

        .bk-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .bk-mark {
            height: 96px;
            width: auto;
            animation: bk-breathe 1.8s ease-in-out infinite;
        }

        @keyframes bk-breathe {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.94); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bk-mark { animation: none; }
        }
    </style>
</head>

<body>
    <div class="bk-loading">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1450" class="bk-mark" aria-label="Brokspace"><defs>
    <linearGradient id="mark-top" x1="0" y1="0" x2="820" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9B57"/><stop offset=".55" stop-color="#FF8A3D"/><stop offset="1" stop-color="#F06A22"/>
    </linearGradient>
    <linearGradient id="mark-fold" x1="118" y1="572" x2="820" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E05A22"/><stop offset=".55" stop-color="#F57A2E"/><stop offset="1" stop-color="#B83A16"/>
    </linearGradient>
    <linearGradient id="mark-flap" x1="392" y1="709" x2="820" y2="819" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4E8EE"/><stop offset="1" stop-color="#9AA3AF"/>
    </linearGradient>
    <linearGradient id="mark-wedge" x1="820" y1="819" x2="0" y2="1450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9C1CB"/><stop offset="1" stop-color="#3E4650"/>
    </linearGradient>
  </defs>
  <polygon fill="url(#mark-top)" points="0,0 820,410 526,368 0,105"/>
  <polygon fill="url(#mark-fold)" points="526,368 820,410 308,666 118,572"/>
  <polygon fill="url(#mark-flap)" points="392,709 496,657 820,819 526,776"/>
  <polygon fill="url(#mark-wedge)" points="526,776 820,819 0,1450 0,1039"/></svg>
    </div>
</body>

</html>
