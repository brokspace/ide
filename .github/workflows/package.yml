name: Package

# Builds Brokspace IDE for Linux (deb, AppImage, tar.gz), macOS (dmg, zip)
# and Windows (NSIS), with brok and brok-agent bundled, and keeps the
# installers as workflow artifacts (ide-<platform>), with .sha256 files and
# update metadata. Runs:
#   - on pull requests that touch packaging, to try the installers before a release;
#   - on demand: Actions > Package > Run workflow, or `gh workflow run package.yml --ref <branch>`;
#   - from the Release workflow, which attaches the artifacts to the release.
#
# Download a build with `gh run download <run id> -n ide-windows-x64`.

on:
  pull_request:
    paths:
      - applications/electron/**
      - packaging/**
      - patches/**
      - scripts/fetch-brok.mjs
      - package.json
      - yarn.lock
      - .github/workflows/package.yml
      - .github/workflows/release.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, platform: linux, arch: x86_64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: aarch64 }
          - { name: macos-arm64, os: macos-latest, platform: macos, arch: aarch64 }
          - { name: macos-x64, os: macos-15-intel, platform: macos, arch: x86_64 }
          - { name: windows-x64, os: windows-latest, platform: windows, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: System libraries for native modules
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbfile-dev libsecret-1-dev rpm
      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Bundle brok and brok-agent
        run: node scripts/fetch-brok.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build
        run: yarn build:extensions && yarn download:plugins && yarn electron build:prod
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Package
        run: yarn electron package
      - name: Checksums
        shell: bash
        working-directory: applications/electron/dist
        run: |
          shopt -s nullglob
          for f in *.deb *.AppImage *.tar.gz *.dmg *.zip *.exe; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; else shasum -a 256 "$f" | cut -d' ' -f1 > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ide-${{ matrix.name }}
          path: |
            applications/electron/dist/*.deb
            applications/electron/dist/*.AppImage
            applications/electron/dist/*.tar.gz
            applications/electron/dist/*.dmg
            applications/electron/dist/*.zip
            applications/electron/dist/*.exe
            applications/electron/dist/*.blockmap
            applications/electron/dist/*.sha256
            applications/electron/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
