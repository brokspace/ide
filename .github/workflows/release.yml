name: Release

# Tag vX.Y.Z (matching package.json) to build and publish Brokspace IDE for
# Linux (deb, AppImage, tar.gz), macOS (dmg, zip) and Windows (NSIS), with
# brok and brok-agent bundled. The Package workflow builds the installers;
# this one attaches them to the release and publishes it. Optional
# follow-ups, each skipped when its secret is missing:
#   HOMEBREW_TAP_TOKEN  - update brokspace/homebrew-tap (Casks/brokspace-ide.rb)
#   APT_GPG_PRIVATE_KEY, APT_GPG_KEY_ID, APT_REPO_TOKEN - publish the APT repository (brokspace/apt, GitHub Pages)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Brokspace IDE $TAG"

  package:
    needs: create-release
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  upload:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ide-*
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Update brokspace/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping the Homebrew cask"; exit 0; fi
          git clone "https://x-access-token:${TOKEN}@github.com/brokspace/homebrew-tap.git" tap
          node packaging/homebrew/render.mjs --ide "${TAG#v}" --out tap
          cd tap
          git config user.name "brokspace-bot"
          git config user.email "brokspace-bot@users.noreply.github.com"
          git add Casks/brokspace-ide.rb
          git commit -m "brokspace-ide ${TAG#v}" || exit 0
          git push

  apt:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ide-linux-*
          path: debs
          merge-multiple: true
      - name: Publish brokspace/apt
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          if [ -z "$GPG_KEY" ] || [ -z "$APT_GPG_KEY_ID" ] || [ -z "$TOKEN" ]; then echo "::notice::APT secrets not set; skipping the APT repository"; exit 0; fi
          sudo apt-get update && sudo apt-get install -y apt-utils
          echo "$GPG_KEY" | gpg --batch --import
          git clone --branch gh-pages "https://x-access-token:${TOKEN}@github.com/brokspace/apt.git" site || { git clone "https://x-access-token:${TOKEN}@github.com/brokspace/apt.git" site && git -C site checkout --orphan gh-pages; }
          bash packaging/apt/build-repo.sh debs site
          cd site
          git config user.name "brokspace-bot"
          git config user.email "brokspace-bot@users.noreply.github.com"
          git add -A
          git commit -m "brokspace-ide ${TAG#v}" || exit 0
          git push origin gh-pages
